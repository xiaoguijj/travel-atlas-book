name: V1 progress events

on:
  push:
    branches: ['**', '!main']
  create:
  delete:
  pull_request_target:
    types: [opened, synchronize, converted_to_draft, ready_for_review, closed, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    paths:
      - 'docs/v1/**'
      - 'docs/Travel-Atlas-Book-V1-Development-Plan.md'
      - '.github/workflows/v1-progress*.yml'

permissions: {}

jobs:
  signal:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'create' && github.event_name != 'delete' ||
       github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      # Signal only. No checkout or use of PR code/data by the publisher.
      - run: echo 'Requested a V1 progress refresh'

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify and build dashboard preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m unittest discover -s docs/v1 -v
          node --check docs/v1/dashboard/board.js
          python3 -B docs/v1/progress.py --output _site
      - uses: actions/upload-artifact@v6
        with:
          name: v1-dashboard-preview
          path: _site
          if-no-files-found: error
